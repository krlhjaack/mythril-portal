        .nav-logo { height: 40px; width: auto; margin-right: 15px; filter: drop-shadow(0 0 8px rgba(16, 185, 129, 0.4)); }

        .nav-tab:hover { color: #10b981; background: rgba(16, 185, 129, 0.03); }
        .nav-tab.active { border-color: #10b981; color: #10b981; background: rgba(16, 185, 129, 0.08); }

        .audio-player-fixed { position: fixed; bottom: 30px; left: 30px; z-index: 1000; background: rgba(13, 17, 23, 0.95); border: 1px solid rgba(16, 185, 129, 0.4); padding: 15px 25px; border-radius: 15px; display: flex; align-items: center; gap: 20px; backdrop-filter: blur(15px); box-shadow: 0 15px 40px rgba(0,0,0,0.7); }

        .vol-slider { -webkit-appearance: none; width: 80px; height: 4px; border-radius: 2px; background: #333; outline: none; cursor: pointer; }
        .vol-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: #10b981; }

        .quest-item { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); border-radius: 15px; padding: 25px; margin-bottom: 15px; display: flex; align-items: center; transition: 0.3s; }
        .quest-item:hover { background: rgba(16, 185, 129, 0.05); border-color: #10b981; }
        .quest-badge { min-width: 60px; height: 60px; background: #10b981; color: #000; display: flex; align-items: center; justify-content: center; font-weight: 900; border-radius: 12px; margin-right: 25px; font-size: 20px; }

        .animate-fade { animation: slideLeft 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
        @keyframes slideLeft {
            from { opacity: 0; transform: translateX(30px); filter: blur(4px); }
            to { opacity: 1; transform: translateX(0); filter: blur(0); }
        }
    </style>
</head>
<body onclick="startAudioContext()">

        function renderTab(tab) {
            const app = document.getElementById('app');
            if(tab === 'quest') {

                    html += `<div class="quest-item"><div class="quest-badge">#${q.id}</div><div class="flex-1"><h4 class="text-white text-lg font-bold">${q.task}</h4><p class="text-gray-500 text-[11px] uppercase tracking-widest mt-1 font-black">${q.map} • NPC: ${q.npc}</p></div><div class="text-right"><span class="text-[9px] text-gray-600 uppercase block font-black">Recompensa</span><span class="text-emerald-500 font-mono font-bold">${q.prize}</span></div></div>`;
                });
                app.innerHTML = html + `</div>`;
            }
        }

        renderTab('quest');

    <script src="https://cdn.jsdelivr.net/npm/tsparticles@2.12.0/tsparticles.bundle.min.js"></script>
    <script>
        tsParticles.load("tsparticles", { 
            particles: { number: { value: 100 }, color: { value: "#10b981" }, opacity: { value: 0.15 }, move: { enable: true, speed: 1.5, direction: "top" } },
            interactivity: {
                events: { onHover: { enable: true, mode: "repulse" } },
                modes: { repulse: { distance: 100, duration: 0.4 } }
            }
