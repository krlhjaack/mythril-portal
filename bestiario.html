<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bestiário Mythril | 21 Soberanos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        body { background-color: #0b0e11; color: #e2e8f0; font-family: 'Inter', sans-serif; margin: 0; overflow-x: hidden; }
        .mu-green { color: #10b981; }
        .titulo-mythril { font-family: 'Montserrat', sans-serif; letter-spacing: 0.2em; text-transform: uppercase; }
        
        /* MENU PADRÃO HOME (PESO 900) */
        .nav-link { 
            padding: 15px 25px; font-weight: 900; color: #4b5563; 
            text-transform: uppercase; transition: 0.3s; letter-spacing: 1px; font-size: 1rem;
        }
        .nav-link:hover, .nav-link.active { color: #10b981; }

        /* CARDS DA GRADE */
        .boss-card { 
            background: rgba(0, 0, 0, 0.8); border: 1px solid rgba(16, 185, 129, 0.1); 
            border-radius: 20px; overflow: hidden; transition: 0.4s; cursor: pointer;
            position: relative; z-index: 10; backdrop-filter: blur(5px);
        }
        .boss-card:hover { border-color: #10b981; transform: translateY(-5px); box-shadow: 0 10px 20px rgba(16, 185, 129, 0.1); }
        .boss-img-thumb { width: 100%; height: 200px; object-fit: cover; opacity: 0.7; transition: 0.5s; }
        .boss-card:hover .boss-img-thumb { opacity: 1; }

        /* MODAL DE ZOOM AMPLIADO */
        #modal-zoom {
            display: none; position: fixed; inset: 0; z-index: 999;
            background: rgba(0,0,0,0.92); backdrop-filter: blur(12px);
            align-items: center; justify-content: center; padding: 20px;
        }
        .modal-content {
            background: #0d1117; border: 2px solid #10b981; border-radius: 25px;
            max-width: 1100px; width: 95%; max-height: 90vh; overflow-y: auto;
            box-shadow: 0 0 50px rgba(16, 185, 129, 0.3);
            animation: zoomIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes zoomIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        #modal-img-large { width: 100%; height: 100%; max-height: 550px; object-fit: contain; background: #000; }

        /* PARTICULAS BACKGROUND */
        #tsparticles { position: fixed; width: 100%; height: 100%; z-index: 1; top: 0; left: 0; pointer-events: none; }

        /* SCROLLBAR MODAL */
        .modal-content::-webkit-scrollbar { width: 6px; }
        .modal-content::-webkit-scrollbar-thumb { background: #10b981; border-radius: 10px; }
    </style>
</head>
<body>

    <div id="tsparticles"></div>

    <nav class="bg-[#0d1117] border-b border-white/5 sticky top-0 z-[100]">
        <div class="container mx-auto px-6 flex justify-between items-center py-4">
            <div class="flex items-center">
                <img src="https://i.ibb.co/YBjy4ZwL/a1316199-0543-4883-b41f-56d0be86645c.png" class="h-10 mr-3">
                <span class="titulo-mythril mu-green font-black text-xl">Mythril</span>
            </div>
            <div class="flex">
                <a href="index.html" class="nav-link">Home</a>
                <a href="personagens.html" class="nav-link">Classes</a>
                <a href="quest.html" class="nav-link">Missões</a>
                <a href="bestiario.html" class="nav-link active">Bosses</a>
            </div>
        </div>
    </nav>

    <div class="container mx-auto px-6 py-20 relative z-10">
        <div class="text-center mb-16">
            <h1 class="titulo-mythril text-4xl md:text-5xl font-black mb-4 italic text-white">Bestiário <span class="mu-green">Lorencia</span></h1>
            <p class="text-gray-500 uppercase font-bold tracking-[0.4em] text-xs italic">Clique no Boss para detalhes e inventário de drops</p>
        </div>

        <div id="boss-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6"></div>
    </div>

    <div id="modal-zoom" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="flex flex-col md:flex-row">
                <div class="md:w-1/2 bg-black flex items-center justify-center border-r border-white/5">
                    <img id="modal-img-large" src="" alt="Boss Image">
                </div>

                <div class="md:w-1/2 p-8 lg:p-12">
                    <div class="flex justify-between items-start mb-6">
                        <div>
                            <h2 id="modal-title" class="titulo-mythril mu-green text-3xl md:text-4xl font-black italic"></h2>
                            <p id="modal-map" class="text-gray-500 font-bold uppercase text-sm tracking-widest mt-1"></p>
                        </div>
                        <button onclick="closeModal()" class="text-gray-500 hover:text-white transition-colors">
                            <i class="fas fa-times text-3xl"></i>
                        </button>
                    </div>

                    <div class="grid grid-cols-2 gap-4 mb-8">
                        <div class="bg-white/5 p-5 rounded-2xl border border-white/10">
                            <span class="text-[10px] text-gray-500 font-black uppercase block mb-1">Pontos de Vida</span>
                            <span id="modal-hp" class="text-white font-black text-2xl tracking-tighter"></span>
                        </div>
                        <div class="bg-white/5 p-5 rounded-2xl border border-white/10">
                            <span class="text-[10px] text-gray-500 font-black uppercase block mb-1">Localização</span>
                            <span id="modal-coords" class="text-white font-black text-2xl tracking-tighter"></span>
                        </div>
                    </div>

                    <h4 class="mu-green text-[11px] font-black uppercase mb-4 tracking-[0.3em]">Inventário de Recompensas</h4>
                    <div id="modal-drops" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/tsparticles@2.12.0/tsparticles.bundle.min.js"></script>
    <script>
        // CONFIGURAÇÃO DAS PARTÍCULAS
        tsParticles.load("tsparticles", {
            particles: {
                number: { value: 350 },
                color: { value: "#10b981" },
                opacity: { value: 5 },
                size: { value: 2 },
                move: { enable: true, speed: 1.2, direction: "top", random: true }
            }
        });

        // LISTA OFICIAL DOS 21 BOSSES
        const bosses = [
            { name: "Skeleton King", map: "Lorencia", hp: "120.000", coords: "Várias", img: "https://imgur.com/uWwYBCT.jpeg", drops: ["Jewel of Bless", "Box of Luck", "Zen (5kk)"] },
            { name: "Red Dragon", map: "Noria", hp: "250.000", coords: "Invasão", img: "https://imgur.com/ZE0dDUd.jpeg", drops: ["Jewel Pack", "BOK +1", "Chaos Crystal"] },
            { name: "Volkris", map: "Elbeland", hp: "450.000", coords: "Centro", img: "https://imgur.com/AaeTFYo.jpeg", drops: ["Jewel of Life", "Box +2", "Small Wings"] },
            { name: "White Wizard", map: "Devias", hp: "80.000", coords: "Invasão", img: "https://imgur.com/f71jxXf.jpeg", drops: ["Wizard Ring", "Jewel of Bless"] },
            { name: "Ordynax", map: "Dungeon 3", hp: "900.000", coords: "230, 15", img: "https://imgur.com/l19QK1S.jpeg", drops: ["Ancient Hyon", "Anubis Parts", "Gaion Set"] },
            { name: "Abyss Lord", map: "Atlans", hp: "1.500.000", coords: "Deep", img: "https://imgur.com/HtPN8nj.jpeg", drops: ["Ashcrow Armor", "Eclipse Staff", "Jewels"] },
            { name: "Venom Arachne", map: "Losttower 7", hp: "2.800.000", coords: "Topo", img: "https://imgur.com/vwPDbP2.jpeg", drops: ["BOK +4", "Jewel Pack", "Soul Crystal"] },
            { name: "Pharaoh", map: "Tarkan 2", hp: "4.500.000", coords: "120, 220", img: "https://imgur.com/V3jYZO9.jpeg", drops: ["Great Dragon", "Dark Soul Exc", "Harmony"] },
            { name: "Zalthor", map: "Aida 2", hp: "6.000.000", coords: "Deep", img: "https://imgur.com/qdv2CM4.jpeg", drops: ["Gemstone x10", "Harmony Stone", "Life"] },
            { name: "Morthelia", map: "Icarus", hp: "7.500.000", coords: "Fim", img: "https://imgur.com/2uWwX7p.jpeg", drops: ["Feather of Condor", "Crest of Monarch", "Soul"] },
            { name: "Luxarion", map: "Kanturu", hp: "12.000.000", coords: "Boss Room", img: "https://imgur.com/Wqz20a3.jpeg", drops: ["380 Mastery", "Venom Mist", "Knight Set"] },
            { name: "Khaelor", map: "Karutan", hp: "15.000.000", coords: "Fim", img: "https://imgur.com/CxALtly.jpeg", drops: ["Ancient Weapon", "Karutan Box", "Chaos"] },
            { name: "Selupan", map: "Raklion", hp: "30.000.000", coords: "Selado", img: "https://imgur.com/z0GOlCh.jpeg", drops: ["Socket 380", "Seed Sphere", "BOK +5"] },
            { name: "Medusa", map: "Swamp", hp: "50.000.000", coords: "Centro", img: "https://imgur.com/pWQ3Xhr.jpeg", drops: ["Titan Pieces", "Brave Helm", "Seraphim Set"] },
            { name: "Morveth", map: "Vulcanus", hp: "65.000.000", coords: "Var", img: "https://imgur.com/KhJk3cL.jpeg", drops: ["Bloodangel Soul", "Ruud 1000", "Mastery Soul"] },
            { name: "Acheron Guardian", map: "Acheron", hp: "80.000.000", coords: "Gate", img: "https://via.placeholder.com/500?text=Guardian", drops: ["Pentagram R2", "Mithril", "Elixir"] },
            { name: "Bloodwing", map: "Acheron", hp: "100.000.000", coords: "Deep", img: "https://imgur.com/gyerLus.jpeg", drops: ["Radiant Ertei", "Rank 3 Penta", "Jewels"] },
            { name: "Sylvaelis", map: "Debender", hp: "150.000.000", coords: "Forest", img: "https://imgur.com/phEb5s3.jpeg", drops: ["Holy Angel Wp", "Mastery Box", "Soul"] },
            { name: "Magriffy", map: "Nars", hp: "200.000.000", coords: "Fim", img: "https://imgur.com/rtM4owy.jpeg", drops: ["Ruud Box 5000", "Mastery Soul", "Penta R3"] },
            { name: "Lord Silvester", map: "Uruk", hp: "350.000.000", coords: "Topo", img: "https://via.placeholder.com/500?text=Silvester", drops: ["Darkangel Mastery", "Ruud", "Ancient Piece"] },
            { name: "Ferea General", map: "Ferea", hp: "600.000.000", coords: "Centro", img: "https://via.placeholder.com/500?text=Ferea", drops: ["Holy Angel Soul", "Ruud 10k", "General Box"] }
        ];

        // RENDERIZAÇÃO DA GRADE
        const grid = document.getElementById('boss-grid');
        bosses.forEach((b, index) => {
            grid.innerHTML += `
                <div class="boss-card" onclick="openBoss(${index})">
                    <img src="${b.img}" class="boss-img-thumb" onerror="this.src='https://via.placeholder.com/400x200?text=Mythril+Boss'">
                    <div class="p-5">
                        <h3 class="text-white font-black text-lg italic uppercase leading-none mb-2">${b.name}</h3>
                        <p class="text-gray-500 text-[10px] font-black uppercase mb-4 tracking-widest">${b.map}</p>
                        <div class="flex justify-between items-center text-[11px] font-black">
                            <span class="mu-green">HP: ${b.hp}</span>
                            <span class="text-gray-600 uppercase">Ver Info +</span>
                        </div>
                    </div>
                </div>
            `;
        });

        // FUNÇÕES DO MODAL
        function openBoss(idx) {
            const b = bosses[idx];
            document.getElementById('modal-img-large').src = b.img;
            document.getElementById('modal-title').innerText = b.name;
            document.getElementById('modal-map').innerText = b.map;
            document.getElementById('modal-hp').innerText = b.hp;
            document.getElementById('modal-coords').innerText = b.coords;
            
            const dropContainer = document.getElementById('modal-drops');
            dropContainer.innerHTML = "";
            b.drops.forEach(item => {
                dropContainer.innerHTML += `
                    <div class="bg-white/5 border border-white/5 p-3 rounded-xl text-[11px] font-bold text-gray-300 uppercase flex items-center gap-3">
                        <i class="fas fa-gem mu-green"></i>
                        ${item}
                    </div>
                `;
            });

            document.getElementById('modal-zoom').style.display = 'flex';
            document.body.style.overflow = 'hidden'; // Trava o scroll do fundo
        }

        function closeModal() {
            document.getElementById('modal-zoom').style.display = 'none';
            document.body.style.overflow = 'auto'; // Destrava o scroll do fundo
        }
    </script>
</body>
</html>
