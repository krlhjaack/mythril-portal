<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guia Mythril | Home</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #0b0e11; color: #e2e8f0; font-family: 'Inter', sans-serif; margin: 0; overflow-x: hidden; }
        .mu-green { color: #10b981; }
        .titulo-mythril { font-family: 'Montserrat', sans-serif; letter-spacing: 0.2em; text-transform: uppercase; }
        
        /* Ajuste para permitir interatividade com as partículas */
        #tsparticles { position: fixed; width: 100%; height: 100%; top: 0; left: 0; z-index: 0; pointer-events: all; }
        
        .nav-logo { height: 40px; width: auto; margin-right: 15px; filter: drop-shadow(0 0 8px rgba(16, 185, 129, 0.4)); }
        .nav-tab { cursor: pointer; padding: 18px 25px; font-size: 11px; font-weight: 900; letter-spacing: 0.2em; transition: 0.4s; border-bottom: 3px solid transparent; color: #4b5563; text-transform: uppercase; display: inline-block; }
        .nav-tab:hover { color: #10b981; background: rgba(16, 185, 129, 0.03); }
        .nav-tab.active { border-color: #10b981; color: #10b981; background: rgba(16, 185, 129, 0.08); }

        /* EFEITO DE ARRASTA SUAVE PARA O LADO NA TRANSIÇÃO */
        .page-transition { animation: slideLeft 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
        
        @keyframes slideLeft {
            from { 
                opacity: 0; 
                transform: translateX(30px); /* Começa um pouco para a direita */
                filter: blur(4px); 
            }
            to { 
                opacity: 1; 
                transform: translateX(0); /* Termina na posição original */
                filter: blur(0); 
            }
        }

        .video-card { 
            position: relative; 
            width: 100%; 
            aspect-ratio: 16/9; 
            background: #000; 
            border: 1px solid rgba(255,255,255,0.08); 
            border-radius: 20px; 
            overflow: hidden; 
            transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); 
            cursor: pointer;
        }
        .video-card:hover { border-color: #10b981; transform: translateY(-8px); box-shadow: 0 15px 40px rgba(16, 185, 129, 0.15); }
        
        .thumb-img { width: 100%; height: 100%; object-fit: cover; opacity: 0.6; transition: 0.5s; }
        .video-card:hover .thumb-img { opacity: 0.9; transform: scale(1.05); }

        .play-btn { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 60px; height: 60px; background: rgba(16, 185, 129, 0.9); 
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            color: #000; font-size: 20px; transition: 0.3s; z-index: 2;
        }
        .video-card:hover .play-btn { background: #fff; transform: translate(-50%, -50%) scale(1.1); }

        .logo-principal { width: 420px; max-width: 85%; filter: drop-shadow(0 0 40px rgba(16, 185, 129, 0.15)); }
    </style>
</head>
<body>
    <div id="tsparticles"></div>

    <nav class="bg-[#0d1117]/95 backdrop-blur-md border-b border-white/5 sticky top-0 z-[100]">
        <div class="container mx-auto px-6 flex flex-col md:flex-row justify-between items-center py-2">
            <a href="index.html" class="flex items-center">
                <img src="https://i.ibb.co/YBjy4ZwL/a1316199-0543-4883-b41f-56d0be86645c.png" class="nav-logo">
                <div class="text-2xl font-black mu-green titulo-mythril">GUIA <span class="text-white">MYTHRIL</span></div>
            </a>
            <div class="flex space-x-1">
                <a href="index.html" class="nav-tab active">Início</a>
                <a href="personagens.html" class="nav-tab">Classes</a>
                <a href="quest.html" class="nav-tab">Quests</a>
                <a href="bestiario.html" class="nav-tab">Bestiário</a>
                <a href="eventos.html" class="nav-tab">Eventos</a>
            </div>
        </div>
    </nav>

    <main class="page-transition relative z-10">
        
        <header class="container mx-auto px-6 pt-24 pb-12 flex flex-col items-center text-center">
            <img src="https://i.ibb.co/YBjy4ZwL/a1316199-0543-4883-b41f-56d0be86645c.png" class="logo-principal mb-10">
            <h1 class="titulo-mythril text-white text-5xl md:text-7xl font-black mb-6">MU <span class="mu-green">MYTHRIL</span></h1>
            <p class="text-gray-400 max-w-2xl text-lg font-medium leading-relaxed">
                EXPLORE O CONTINENTE SAGRADO E PROVE SEU VALOR.
            </p>
        </header>

        <section class="container mx-auto px-6 py-20">
            <div class="flex items-center gap-4 mb-12">
                <div class="h-[3px] w-16 bg-emerald-500 rounded-full"></div>
                <h2 class="titulo-mythril text-white text-2xl font-black">Vídeos em Destaque</h2>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10">
                
                <div class="video-card" onclick="window.open('https://www.youtube.com/watch?v=8yvGCAvOAfM', '_blank')">
                    <img src="https://img.youtube.com/vi/8yvGCAvOAfM/maxresdefault.jpg" class="thumb-img">
                    <div class="play-btn"><i class="fas fa-play"></i></div>
                    <div class="absolute bottom-0 p-6 w-full bg-gradient-to-t from-black">
                        <span class="mu-green text-[10px] font-black uppercase tracking-tighter">Novidade</span>
                        <h3 class="text-white font-bold text-lg">Guia de Jogo #1</h3>
                    </div>
                </div>

                <div class="video-card" onclick="window.open('https://www.youtube.com/watch?v=8yvGCAvOAfM', '_blank')">
                    <img src="https://img.youtube.com/vi/8yvGCAvOAfM/maxresdefault.jpg" class="thumb-img">
                    <div class="play-btn"><i class="fas fa-play"></i></div>
                    <div class="absolute bottom-0 p-6 w-full bg-gradient-to-t from-black">
                        <span class="mu-green text-[10px] font-black uppercase tracking-tighter">Tutorial</span>
                        <h3 class="text-white font-bold text-lg">Estratégias Avançadas</h3>
                    </div>
                </div>

                <div class="video-card" onclick="window.open('https://www.youtube.com/watch?v=8yvGCAvOAfM', '_blank')">
                    <img src="https://img.youtube.com/vi/8yvGCAvOAfM/maxresdefault.jpg" class="thumb-img">
                    <div class="play-btn"><i class="fas fa-play"></i></div>
                    <div class="absolute bottom-0 p-6 w-full bg-gradient-to-t from-black">
                        <span class="mu-green text-[10px] font-black uppercase tracking-tighter">Destaque</span>
                        <h3 class="text-white font-bold text-lg">Melhores Momentos</h3>
                    </div>
                </div>

            </div>
        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/tsparticles@2.12.0/tsparticles.bundle.min.js"></script>
    <script>
        tsParticles.load("tsparticles", { 
            particles: { 
                number: { value: 250 }, 
                color: { value: "#10b981" }, 
                opacity: { value: 0.5 }, 
                move: { enable: true, speed: 0.8, direction: "top" } 
            },
            /* ACRÉSCIMO DO EFEITO DE REPULSÃO */
            interactivity: {
                events: {
                    onHover: {
                        enable: true,
                        mode: "repulse"
                    }
                },
                modes: {
                    repulse: {
                        distance: 100,
                        duration: 0.4
                    }
                }
            }
        });
    </script>
</body>
</html>
